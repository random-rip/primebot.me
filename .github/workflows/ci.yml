name: ci

on: push

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm + Node.js from devEngines in package.json, cached store, `pnpm install --frozen-lockfile`
      - name: Setup pnpm, Node.js and install dependencies
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck
